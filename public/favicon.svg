  <!-- Symmetrical Scales of Justice at Top in Crisp White -->
  <line x1="22" y1="4" x2="22" y2="18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="22" cy="4" r="1.3" fill="#FFFFFF" />
  <line x1="8" y1="8" x2="36" y2="8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <path d="M11 8L7 15H15L11 8Z" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round" fill="none" />
  <path d="M7 15C7 16.5 8.8 17.5 11 17.5C13.2 17.5 15 16.5 15 15" stroke="#FFFFFF" stroke-width="1.4" fill="none" />

