services:
  postgres:
    image: postgres:16-alpine
    container_name: bd_legal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bd_legal_db}
      POSTGRES_USER: ${POSTGRES_USER:-bd_legal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bd_legal_user} -d ${POSTGRES_DB:-bd_legal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bd_legal_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-bd_legal_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-bd_legal_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    networks:
      - internal_net

volumes:
  pgdata:
    driver: local

networks:
  internal_net:
    driver: bridge
