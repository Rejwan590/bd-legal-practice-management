name: Cloudflare CI & Deployment

on:
  push:
    branches:
      - cloudflare
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test Cloudflare Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install admin-app dependencies
        run: npm ci --prefix admin-app

      - name: Run root linter
        run: npm run lint

      - name: Run admin-app linter
        run: npm run lint --prefix admin-app

      - name: Verify pricing parity
        run: npm run verify:pricing

      - name: Install server-cloudflare dependencies
        run: npm ci --prefix server-cloudflare

      - name: Run server-cloudflare Vitest suite
        run: npm test --prefix server-cloudflare

  deploy:
    name: Deploy to Cloudflare Pages & Worker
    runs-on: ubuntu-latest
    needs: test

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & admin-app dependencies
        run: |
          npm ci
          npm ci --prefix admin-app

      - name: Build unified Cloudflare Pages bundle
        run: npm run build:pages

      - name: Deploy Cloudflare Pages (bdlegal-app)
        run: |
          npx wrangler pages deploy dist --project-name bdlegal-app --branch cloudflare

      - name: Install server-cloudflare dependencies
        run: npm ci --prefix server-cloudflare

      - name: Deploy Cloudflare Worker API (bdlegal-api)
        run: |
          npx --prefix server-cloudflare wrangler deploy -c server-cloudflare/wrangler.toml
